[package]
name = "packetbench"
version = "0.14.7"
description = "PacketBench — Agent Development Environment (IDE + multi-agent orchestration)"
authors = ["PacketBench"]
edition = "2021"
license = "Apache-2.0"
default-run = "packetbench"

[lib]
name = "packetbench_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-global-shortcut = "2"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
ts-rs = { version = "10", features = ["serde-compat"] }
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
# Vendored + patched portable-pty 0.8.1: `close_random_fds` was rewritten to be
# allocation-free so PTY fork()+exec() doesn't abort in the child on macOS in a
# heavily-threaded (WebKit) host. See src-tauri/vendor/portable-pty.
portable-pty = { path = "vendor/portable-pty" }
toml = "0.8"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"] }
async-trait = "0.1"
glob = "0.3"
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
tracing-appender = "0.2"
regex = "1"
sha2 = "0.10"
base64 = "0.22"
time = { version = "0.3", features = ["formatting", "parsing"] }
fuzzy-matcher = "0.3"
dirs = "5"
keyring = { version = "3", features = ["sync-secret-service", "windows-native", "apple-native"] }
zeroize = "1"
cpal = "0.17"
whisper-rs = "0.16"
rustfft = "6"
rusqlite = { version = "0.33", features = ["bundled"] }
notify = "6"
tauri-plugin-window-state = "2"
# N3 — PacketBench-as-MCP-server (Streamable HTTP, loopback-only). `rmcp` is the
# official Rust MCP SDK; axum hosts the transport service; tokio-util provides
# the CancellationToken used for graceful shutdown.
rmcp = { version = "2", features = ["transport-streamable-http-server"] }
axum = "0.8"
tokio-util = "0.7"
tempfile = "3"

[target.'cfg(target_os = "windows")'.dependencies]
clipboard-win = "5.0"
enigo = "0.2"
